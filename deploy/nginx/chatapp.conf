# Nginx SNIPPET: the chat app under the sub-path /viikko5/
#
# This is NOT a site of its own (server block). It is included into the server's
# existing site, so the earlier weeks (/viikko2/ etc.) keep working.
#
# deploy.sh copies this file to /etc/nginx/snippets/chatapp.conf.
# The existing site's server { } block gets this line ONCE, added by hand:
#     include snippets/chatapp.conf;
#
# ^~ = if the path starts with /viikko5/, Nginx does not try the site's regex locations.

location = /viikko5 {
    return 301 /viikko5/;
}

# Static files are served by Nginx directly from disk
location ^~ /viikko5/static/ {
    alias /opt/chatapp/app/static/;
    expires 1h;
    add_header Cache-Control "public";
}

location ^~ /viikko5/ {
    # The slash after the socket (:/) strips the prefix: /viikko5/api/chat -> /api/chat.
    # Flask gets the prefix from X-Forwarded-Prefix and uses it in links.
    proxy_pass http://unix:/run/chatapp/gunicorn.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /viikko5;

    client_max_body_size 64k;

    # The LLM reply is streamed token by token -> no buffering
    proxy_buffering off;
    proxy_cache off;

    # A model running on the CPU can be slow
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}